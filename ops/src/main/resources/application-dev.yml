# dev = NAS development environment. The database is the MySQL running on the NAS, the same one as conductor's dev database.
spring:
  datasource:
    url: jdbc:mysql://${ADING_DB_HOST:localhost}:${ADING_DB_PORT:3306}/${ADING_DB_NAME:ading}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${ADING_DB_USER:root}
    password: ${ADING_DB_PASSWORD:}

# This machine and the NAS are outside the Alibaba Cloud VPC, so attachments are read via the public endpoint.
ading:
  ops:
    oss:
      endpoint: ${ADING_OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}

logging:
  level:
    com.politeness.ading.ops: DEBUG

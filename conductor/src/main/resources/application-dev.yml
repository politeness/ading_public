# dev = NAS development environment.
# No Alibaba Cloud internal network is available here, so the database is a MySQL running on the NAS and OSS uses the public endpoint.
spring:
  datasource:
    url: jdbc:mysql://${ADING_DB_HOST:localhost}:${ADING_DB_PORT:3306}/${ADING_DB_NAME:ading}?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${ADING_DB_USER:root}
    password: ${ADING_DB_PASSWORD:}

ading:
  support:
    # Public endpoint: the NAS is not inside the Alibaba Cloud VPC, so internal domain names do not resolve here.
    oss-endpoint: ${ADING_OSS_ENDPOINT:https://oss-cn-shanghai.aliyuncs.com}
    # There is only one online ops console; dev reports go there too and are labeled as dev by channel on the page.
    ops-base-url: ${ADING_OPS_BASE_URL:https://www.coffeestudy.com.cn/ading/ops}

logging:
  level:
    com.politeness.ading.conductor: DEBUG

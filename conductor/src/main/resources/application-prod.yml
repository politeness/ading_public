# prod = production deployment environment on ECS.
# Alibaba Cloud components always talk over the internal network: the database uses the RDS internal domain, and OSS uses the same-region VPC internal endpoint.
spring:
  datasource:
    url: jdbc:mysql://${ADING_DB_HOST}:${ADING_DB_PORT:3306}/${ADING_DB_NAME:ading}?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${ADING_DB_USER}
    password: ${ADING_DB_PASSWORD}

ading:
  support:
    # Internal endpoint: ECS to OSS should not go over the public internet, which is slower and billed as public traffic.
    oss-endpoint: ${ADING_OSS_ENDPOINT:https://oss-cn-shanghai-internal.aliyuncs.com}
    # The ops console runs on the same ECS as the production and pre-release services and listens on localhost only.
    ops-base-url: ${ADING_OPS_BASE_URL:http://127.0.0.1:8280/ading/ops}

logging:
  level:
    com.politeness.ading.conductor: INFO
